service: luna-rag-backend

frameworkVersion: '3'
provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    NODE_ENV: production
    LEMONSQUEEZY_API_KEY: ${ssm:/luna-rag/lemonsqueezy-api-key}
    LEMONSQUEEZY_STORE_ID: 214097
    JWT_SECRET: ${ssm:/luna-rag/jwt-secret}
    DYNAMODB_TABLE: luna-rag-users
    OPENAI_API_KEY: ${ssm:/luna-rag/openai-api-key}

functions:
  api:
    handler: src/index.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
    environment:
      DYNAMODB_TABLE: luna-rag-users

plugins:
  - serverless-offline
  - serverless-dotenv-plugin

custom:
  serverless-offline:
    httpPort: 3001
    websocketPort: 3002
  dotenv:
    path: .env

resources:
  Resources:
    DynamoDBTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        GlobalSecondaryIndexes:
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL

  Outputs:
    ApiUrl:
      Description: API Gateway URL
      Value:
        Fn::Sub: ${ApiGatewayRestApi.Url}
    DynamoDBTable:
      Description: DynamoDB Table Name
      Value: ${self:provider.environment.DYNAMODB_TABLE}