
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Agents Test Report</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: #f5f5f7; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { padding: 30px; border-bottom: 1px solid #e5e5e7; }
        .content { padding: 30px; }
        .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .metric { background: #f8f9fa; padding: 20px; border-radius: 8px; text-align: center; }
        .metric-value { font-size: 2em; font-weight: bold; color: #333; }
        .metric-label { color: #666; margin-top: 5px; }
        .success { color: #28a745; }
        .failure { color: #dc3545; }
        .warning { color: #ffc107; }
        .suite { background: #f8f9fa; margin: 20px 0; border-radius: 8px; overflow: hidden; }
        .suite-header { padding: 20px; background: #e9ecef; font-weight: bold; }
        .suite-content { padding: 20px; }
        .test { padding: 10px 0; border-bottom: 1px solid #e5e5e7; }
        .test:last-child { border-bottom: none; }
        .test-passed { color: #28a745; }
        .test-failed { color: #dc3545; }
        .test-skipped { color: #6c757d; }
        .timestamp { color: #6c757d; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Luna Agents Test Report</h1>
            <p class="timestamp">Generated on 11/4/2025, 11:55:15 PM</p>
        </div>

        <div class="content">
            <div class="summary">
                <div class="metric">
                    <div class="metric-value success">14</div>
                    <div class="metric-label">Total Tests</div>
                </div>
                <div class="metric">
                    <div class="metric-value success">14</div>
                    <div class="metric-label">Passed</div>
                </div>
                <div class="metric">
                    <div class="metric-value failure">0</div>
                    <div class="metric-label">Failed</div>
                </div>
                <div class="metric">
                    <div class="metric-value warning">0</div>
                    <div class="metric-label">Skipped</div>
                </div>
                <div class="metric">
                    <div class="metric-value">100.0%</div>
                    <div class="metric-label">Success Rate</div>
                </div>
                <div class="metric">
                    <div class="metric-value">0.28s</div>
                    <div class="metric-label">Duration</div>
                </div>
            </div>

            <h2>Test Suites</h2>
            
                <div class="suite">
                    <div class="suite-header">
                        Luna Shortcuts Tests
                        <span class="success">✅ PASSED</span>
                    </div>
                    <div class="suite-content">
                        <p>
                            <strong>Results:</strong> 5/5 passed
                            
                            
                          </p>
                          
                        
                    </div>
                </div>
            
                <div class="suite">
                    <div class="suite-header">
                        Luna All Commands Tests
                        <span class="success">✅ PASSED</span>
                    </div>
                    <div class="suite-content">
                        <p>
                            <strong>Results:</strong> 9/9 passed
                            
                            
                          </p>
                          
                        
                    </div>
                </div>
            
        </div>
    </div>
</body>
</html>
